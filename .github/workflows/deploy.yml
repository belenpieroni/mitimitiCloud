name: CD - Deploy a ECS

# Se dispara cuando el workflow de CI termina sobre main (es decir, después de cada merge).
# Solo despliega si el CI pasó: nunca se sube a AWS código con tests en rojo.
# workflow_dispatch permite correrlo a mano (por ejemplo, para subir la primera imagen).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Un deploy por vez; si llega otro merge, espera a que termine el anterior.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # para pedirle a GitHub el token OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mitimiti-backend
  ECS_CLUSTER: mitimiti-cluster
  ECS_SERVICE: mitimiti-backend

jobs:
  deploy:
    name: Build, push a ECR y deploy en ECS
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Sin "environment:" a propósito: con un environment, el token OIDC cambia su claim "sub"
    # a repo:...:environment:<nombre> y deja de coincidir con la trust policy del rol (rama main).

    steps:
      - name: Checkout del commit que pasó el CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Sin access keys: GitHub firma un token OIDC y AWS lo cambia por credenciales temporales del rol.
      - name: Autenticar contra AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-deploy-${{ github.run_id }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          # El SHA identifica qué commit está desplegado; latest es el que usa la Task Definition.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Forzar deploy en ECS Fargate
        id: deploy
        run: |
          STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].status" --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "::notice::El servicio $ECS_SERVICE todavía no existe. La imagen quedó en ECR: ahora se puede correr 'npx cdk deploy EcsStack'."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment --query "service.deployments[0].id" --output text
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # Espera a que las réplicas nuevas pasen el health check del ALB (o falla si el circuit breaker hace rollback).
      - name: Esperar a que el servicio quede estable
        if: steps.deploy.outputs.deployed == 'true'
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
