name: CI

# Corre en cada push a cualquier rama y en cada Pull Request.
# Si algún job falla, el commit queda con ❌ y el PR muestra el check en rojo.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Si se sube otro commit a la misma rama, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend - tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # PostgreSQL 16 igual al de RDS, para los tests que necesiten base.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mitimiti
          POSTGRES_USER: mitimiti
          POSTGRES_PASSWORD: mitimiti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mitimiti -d mitimiti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: mitimiti
      DB_USER: mitimiti
      DB_PASSWORD: mitimiti_test
      JWT_SECRET: ci_jwt_secret_solo_para_tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar esquema en la base de pruebas
        run: psql "postgresql://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_NAME" -v ON_ERROR_STOP=1 -q -f src/migrations/schema.sql

      # --if-present: mientras no exista el script "test" (lo agrega TASK de Jest) no falla.
      - name: Ejecutar tests
        run: npm test --if-present

  infra:
    name: Infra - compilar y sintetizar CDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos
        run: npm run build

      # Sin credenciales de AWS: genera las plantillas sin consultar la cuenta.
      - name: cdk synth
        run: npx cdk synth --quiet

  docker:
    name: Backend - build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (sin push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
